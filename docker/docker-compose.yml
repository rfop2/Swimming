services:
  node:
    image: "nuxt-node"
    hostname: "node"
    build: .
    environment:
      NODE_ENV: production
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      IGNORE_IPS: ${IGNORE_IPS}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
    volumes:
      - ../web/.output/:/home/node/app
    #ports:
      #- "3080:3000"
    restart: unless-stopped
    networks:
      app:
        ipv4_address: ${NETWORK_NODE_IP}
    tty: true

  db:
    image: mariadb:11.8
    hostname: db
    volumes:
      - ./mariadb/config:/etc/mysql/mariadb.conf.d/:ro
      - ./mariadb/bootstrap:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql:rw
    #ports:
      #- "3308:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    restart: unless-stopped
    networks:
      app:
        ipv4_address: ${NETWORK_DB_IP}

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "58888:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_ALLOWED_IPS: ${ADMINER_ALLOWED_IPS}
    volumes:
      - ./adminer/plugins:/var/www/html/plugins-enabled
    depends_on:
      - db
    networks:
      app:
        ipv4_address: ${NETWORK_ADMINER_IP}
    profiles:
      - live

volumes:
  db-data:
    driver: local

networks:
  app:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: ${NETWORK_SUBNET}
          gateway: ${NETWORK_GATEWAY_IP}
