version: "2"
services:
  node:
    image: "nuxt-node"
    hostname: "node"
    build: .
    #working_dir: /home/node/app
    environment:
      - NODE_ENV=production
    volumes:
      - ../web/.output/:/home/node/app
      - ../db:/home/node/db
    ports: # use if it is necessary to expose the container to the host machine
      - "3080:3000"
    restart: unless-stopped
    tty: true
    #command: sleep 600
