services:
  node:
    image: "nuxt-node"
    hostname: "node"
    build: .
    environment:
      NODE_ENV: production
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      IGNORE_IPS: ${IGNORE_IPS}

    volumes:
      - ../web/.output/:/home/node/app
    ports:
      - "3080:3000"
    restart: unless-stopped
    networks:
      app:
        ipv4_address: 192.168.45.3
    tty: true

  db:
    image: mariadb:11.8
    hostname: db
    volumes:
      - ./mariadb/config:/etc/mysql/mariadb.conf.d/:ro
      - ./mariadb/bootstrap:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql:rw
    #ports:
      #- "3308:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    restart: unless-stopped
    networks:
      app:
        ipv4_address: 192.168.45.2

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "58888:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_ALLOWED_IPS: ${ADMINER_ALLOWED_IPS}
    volumes:
      - ./adminer/plugins:/var/www/html/plugins-enabled
    depends_on:
      - db
    networks:
      app:
        ipv4_address: 192.168.45.4

volumes:
  db-data:
    driver: local

networks:
  app:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 192.168.45.0/24
          gateway: 192.168.45.1
