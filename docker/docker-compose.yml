services:
  node:
    image: "nuxt-node"
    hostname: "node"
    build: .
    command: ["node", "--import", "./server/sentry.server.config.mjs", "./server/index.mjs"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - ../web/.output/:/home/node/app
    #ports:
      #- "3080:3000"
    restart: unless-stopped
    networks:
      bridge:
        ipv4_address: ${NETWORK_NODE_IP}
    tty: true

  db:
    image: mariadb:11.8
    hostname: db
    volumes:
      - ./mariadb/config:/etc/mysql/mariadb.conf.d/:ro
      - ./mariadb/bootstrap:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql:rw
    #ports:
      #- "3308:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    restart: unless-stopped
    networks:
      bridge:
        ipv4_address: ${NETWORK_DB_IP}

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "58889:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_ALLOWED_IPS: ${ADMINER_ALLOWED_IPS}
    volumes:
      - ./adminer/plugins:/var/www/html/plugins-enabled
    depends_on:
      - db
    networks:
      bridge:
        ipv4_address: ${NETWORK_ADMINER_IP}
    profiles:
      - live

  video-compression-worker:
      image: "nuxt-node"
      hostname: "video-compression-worker"
      build: .
      working_dir: /home/node/app
      command: sh -lc "npx tsx scripts/process-video-compression-worker.ts"
      environment:
        NODE_ENV: production
        MARIADB_HOST: ${MARIADB_HOST}
        MARIADB_PORT: ${MARIADB_PORT:-3306}
        MARIADB_DATABASE: ${MARIADB_DATABASE}
        MARIADB_USER: ${MARIADB_USER}
        MARIADB_PASSWORD: ${MARIADB_PASSWORD}
        AWS_REGION: ${AWS_REGION}
        AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
        AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
        AWS_S3_BUCKET: ${AWS_S3_BUCKET}
        AWS_CLOUDFRONT_URL: ${AWS_CLOUDFRONT_URL}
      volumes:
        - ../web/:/home/node/app
      restart: unless-stopped
      depends_on:
        - db
      networks:
        - bridge

volumes:
  db-data:
    driver: local

networks:
  bridge:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: ${NETWORK_SUBNET}
          gateway: ${NETWORK_GATEWAY_IP}
